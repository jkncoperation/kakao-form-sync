name: kakao-sync

on:
  schedule:
    - cron: "*/5 * * * *"   # 약 5분 간격 (UTC 기준, 실제로는 수 분 지연 가능)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼 활성화

# 실행이 겹치지 않도록 방지 (겹치면 중복 전송 위험)
concurrency:
  group: kakao-sync
  cancel-in-progress: false

permissions:
  contents: write             # checkpoint.json 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: config.json 생성 (Secrets에서)
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: printf '%s' "$CONFIG_JSON" > config.json

      - name: 스크립트 실행
        run: python kakao_sync.py

      - name: checkpoint.json 커밋
        if: always()          # 스크립트가 일부 실패해도 저장된 체크포인트는 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: checkpoint 업데이트 [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "체크포인트 변경 없음 - 커밋 생략"
          fi
